<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Book')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>

<div class="container narrow">
    <h2 th:text="${book.id == null} ? 'Add Book' : 'Edit Book'">Add Book</h2>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/books/save}" th:object="${book}" method="post" class="form-card">
        <input type="hidden" th:field="*{id}">

        <label>ISBN</label>
        <input type="text" th:field="*{isbn}">
        <span class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>

        <label>Title</label>
        <input type="text" th:field="*{title}">
        <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>

        <label>Author</label>
        <input type="text" th:field="*{author}">
        <span class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>

        <label>Category</label>
        <input type="text" th:field="*{category}">

        <label>Total copies</label>
        <input type="number" min="1" th:field="*{totalCopies}">
        <span class="field-error" th:if="${#fields.hasErrors('totalCopies')}" th:errors="*{totalCopies}"></span>

        <div class="form-actions">
            <button type="submit" class="btn">Save</button>
            <a th:href="@{/books}" class="btn secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
